  # Coder alias (handoff_planner references this name)
  deepseek-coder-v2-lite-instruct:
    cmd: |
      ${llama-bin}
      --port ${PORT}
      --model ${models-dir}/Qwen3-Coder-Next-UD-IQ4_NL.gguf
      --ctx-size 32768
      --batch-size 4096
      --n-gpu-layers 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
    ttl: 120

  # 70 B — DeepSeek-R1-Distill-Llama-70B (strategist, architect, final audit)
  deepseek-r1-distill-llama-70b:
    cmd: |
      ${llama-bin}
      --port ${PORT}
      --model ${models-dir}/unsloth/DeepSeek-R1-Distill-Llama-70B-GGUF/DeepSeek-R1-Distill-Llama-70B-IQ4_NL.gguf
      --ctx-size 32768
      --batch-size 2048
      --n-gpu-layers 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --tensor-split 0.5,0.5
    ttl: 60

  # 70 B — Hermes-4-70B (chairman, oracle_judge)
  hermes-4-70b:
    cmd: |
      ${llama-bin}
      --port ${PORT}
      --model ${models-dir}/Hermes-4-70B-IQ4_NL.gguf
      --ctx-size 48000
