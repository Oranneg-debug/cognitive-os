      --cache-type-v q8_0
    ttl: 120

  # 36 B — Hermes 4.3 (creative roles)
  hermes-4.3-36b-heretic-i1:
    cmd: |
      ${llama-bin}
      --port ${PORT}
      --model ${models-dir}/NousResearch_Hermes-4.3-36B-IQ4_NL.gguf
      --ctx-size 65536
      --batch-size 4096
      --n-gpu-layers 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
    ttl: 120

  # Coder — Qwen3-Coder-Next (alpha_perf_specialist, handoff_planner)
  qwen3-coder-next:
    cmd: |
      ${llama-bin}
      --port ${PORT}
      --model ${models-dir}/Qwen3-Coder-Next-UD-IQ4_NL.gguf
      --ctx-size 65536
      --batch-size 4096
      --n-gpu-layers 99
      --flash-attn on
