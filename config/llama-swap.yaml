      --n-gpu-layers 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --tensor-split 0.5,0.5
    ttl: 60

  # 70 B alias (chief_technical_officer role)
  unsloth/hermes-4-70b:
    cmd: |
      ${llama-bin}
      --port ${PORT}
      --model ${models-dir}/Hermes-4-70B-IQ4_NL.gguf
      --ctx-size 32768
